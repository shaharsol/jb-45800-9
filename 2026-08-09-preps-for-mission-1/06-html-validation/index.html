<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form id="user-form" onsubmit="addUser()">

        <!-- available html validations:
        - required (must have some input)
        - min  
        - max
        - minLength
        - maxLength -->

        <!-- note that the best validations are acheived by using the correct input type
        - email
        - color
        - url
        - date -->

        <input id="first-name" placeholder="first name" required/>
        <br/>
        <input id="last-name" placeholder="last name"/>
        <br/>
        <input type="email" id="email" placeholder="email"/>
        <br/>
        <select id="category" required>
            <option value="" disabled selected>please choose a category</option>
            <option value="1">News</option>
            <option value="2">Sports</option>
            <option value="3">Finance</option>
        </select>
        <textarea id="cv" placeholder="your CV..." required minlength="30" maxlength="1200"></textarea>
        <br/>
        <input type="color" id="color" />
        <br/>
        <input type="url" id="pic" placeholder="pic" required/>
        <br/>
        <input type="number" id="no-of-kids" placeholder="how many kids you have" min="0" max="20" required/>
        <br/>
        <button>click me</button>
    </form>


    <table class="styled-table">
        <thead>
            <tr>
                <th>first name</th>
                <th>last name</th>
                <th>email</th>
                <th>category</th>
                <th>cv</th>
                <th>pic</th>
            </tr>
        </thead>
        <tbody id="user-table-body">
            <tr>
                <td>yossi</td>
                <td>cohen</td>
                <td>yossi.cohen@gmail.com</td>
                <td>News</td>
                <td>i worked in cnn</td>
                <td></td>
            </tr>
            <tr>
                <td>shlomit</td>
                <td>yerushalmi</td>
                <td>sh.ye@gmail.com</td>
                <td>Sports</td>
                <td>i worked in espn</td>
                <td></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
